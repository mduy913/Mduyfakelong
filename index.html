<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOT PANEL</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:#fff;
}

.header{
    background:#111827;
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 0 15px rgba(0,0,0,.3);
}

.card h3{
    margin-bottom:10px;
}

.status{
    display:inline-block;
    padding:8px 15px;
    border-radius:999px;
    background:#16a34a;
    font-size:14px;
}

.status.off{
    background:#dc2626;
}

.btn-group{
    display:flex;
    gap:10px;
    margin-top:15px;
}

button{
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    color:#fff;
    font-weight:bold;
}

.start{
    background:#16a34a;
}

.stop{
    background:#dc2626;
}

.restart{
    background:#2563eb;
}

button:hover{
    opacity:.9;
}

.log-box{
    background:#020617;
    border-radius:10px;
    padding:15px;
    height:300px;
    overflow:auto;
    margin-top:15px;
    color:#22c55e;
    font-size:13px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

.stat h2{
    margin-bottom:10px;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:220px;
    height:100%;
    background:#111827;
    padding:20px;
}

.sidebar h2{
    text-align:center;
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    color:#fff;
    text-decoration:none;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
    background:#1e293b;
}

.sidebar a:hover{
    background:#2563eb;
}

.main{
    margin-left:240px;
    padding:20px;
}

@media(max-width:768px){
    .sidebar{
        width:100%;
        height:auto;
        position:relative;
    }

    .main{
        margin-left:0;
    }
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>BOT PANEL</h2>

    <a href="#">Dashboard</a>
    <a href="#">Bots</a>
    <a href="#">Logs</a>
    <a href="#">Settings</a>
</div>

<div class="main">

<div class="header">
    QUẢN LÝ BOT PYTHON
</div>

<div class="stats">
    <div class="stat">
        <h2>5</h2>
        <p>Bot Đang Chạy</p>
    </div>

    <div class="stat">
        <h2>12</h2>
        <p>Tổng Bot</p>
    </div>

    <div class="stat">
        <h2>99.9%</h2>
        <p>Uptime</p>
    </div>
</div>

<div class="card">
    <h3>bot.py</h3>

    <span class="status">
        Đang Hoạt Động
    </span>

    <div class="btn-group">
        <button class="start">START</button>
        <button class="stop">STOP</button>
        <button class="restart">RESTART</button>
    </div>

    <div class="log-box">
[INFO] Bot started...<br>
[INFO] Connected server...<br>
[INFO] Running...<br>
    </div>
</div>

<div class="card">
    <h3>auto.py</h3>

    <span class="status off">
        Đã Dừng
    </span>

    <div class="btn-group">
        <button class="start">START</button>
        <button class="stop">STOP</button>
        <button class="restart">RESTART</button>
    </div>
</div>

</div>

</body>
</html>
